<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Garden Activity Log</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #999;
      padding: 8px;
    }
  </style>
</head>
<body>
  <h1>Garden Activity Log</h1>
  <a href="index.html">Back to Home</a>
  
  <form id="activityForm">
    <label for="date">Date:</label>
    <input type="date" id="date" name="date" required><br>

    <label for="area">Garden Area:</label>
    <select id="area" name="area">
      <option value="Lower Drive and Shed">Lower Drive and Shed</option>
      <option value="Swimming Pool">Swimming Pool</option>
      <option value="Main Border">Main Border</option>
      <option value="Kitchen Courtyard">Kitchen Courtyard</option>
      <option value="Top Lawn">Top Lawn</option>
    </select><br>

    <label for="activity">Activity:</label>
    <select id="activity" name="activity">
      <option value="Weeding">Weeding</option>
      <option value="Mowing">Mowing</option>
      <option value="Planting">Planting</option>
      <option value="Pruning">Pruning</option>
      <option value="Other">Other</option>
    </select><br>

    <label for="hours">Hours Spent:</label>
    <input type="number" id="hours" name="hours" step="0.1" required><br>

    <label for="comment">Comment (max 50 chars):</label>
    <input type="text" id="comment" name="comment" maxlength="50"><br>

    <input type="submit" value="Log Activity">
  </form>

  <h2>Activity Logs</h2>
  <table id="logTable">
    <thead>
      <tr>
        <th>Date</th>
        <th>Area</th>
        <th>Activity</th>
        <th>Hours</th>
        <th>Comment</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <button onclick="downloadLog()">Download CSV</button>

  <script>
    const form = document.getElementById('activityForm');
    const tableBody = document.querySelector('#logTable tbody');
    const logs = [];

    function formatDateToDDMMYYYY(isoDate) {
      const [year, month, day] = isoDate.split('-');
      return `${day}-${month}-${year}`;
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const dateInput = document.getElementById('date').value;
      const area = document.getElementById('area').value;
      const activity = document.getElementById('activity').value;
      const hours = document.getElementById('hours').value;
      const comment = document.getElementById('comment').value;

      const formattedDate = formatDateToDDMMYYYY(dateInput);
      logs.push([formattedDate, area, activity, hours, comment]);

      const row = tableBody.insertRow();
      [formattedDate, area, activity, hours, comment].forEach(text => {
        const cell = row.insertCell();
        cell.textContent = text;
      });

      form.reset();
    });

    function downloadLog() {
      if (logs.length === 0) {
        alert('No activities to download.');
        return;
      }

      const today = new Date();
      const fileDate = `${String(today.getDate()).padStart(2, '0')}-${String(today.getMonth() + 1).padStart(2, '0')}-${today.getFullYear()}`;
      const fileName = `garden-log-${fileDate}.csv`;

      let csvContent = "Date,Area,Activity,Hours,Comment\n" + logs.map(row => row.join(",")).join("\n");

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.setAttribute("href", URL.createObjectURL(blob));
      link.setAttribute("download", fileName);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
